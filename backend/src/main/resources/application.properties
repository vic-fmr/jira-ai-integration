spring.application.name=jira-ai-integration

# ======== GOOGLE GENERATIVE AI CONFIGURATION ========
spring.ai.google.genai.api-key={GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.0-flash
spring.ai.google.genai.chat.options.temperature=0.5


# ======== JIRA CONFIGURATION ========
jira.url=https://renysoo.atlassian.net
jira.username=rml2@cesar.school
# Cole aqui o token gerado no passo 1
jira.token={JIRA_API_TOKEN}
# Ativa o perfil de desenvolvimento.
spring.profiles.active=dev

