## ========= MARIA DB ===========
spring.datasource.url=jdbc:mariadb://localhost:3306/jira_ai_integration

spring.datasource.username=user_dev
spring.datasource.password=user_password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

#
# Configurações do JPA / Hibernate
# 'update': cria/atualiza tabelas automaticamente baseado nas suas Entidades Java
spring.jpa.hibernate.ddl-auto=update

# Mostra as queries SQL no console (útil para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto (Opcional em versões novas do Spring, mas bom para garantir)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect